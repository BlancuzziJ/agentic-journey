<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inside the Agent Crew — Agentic Journey</title>
<style>
  :root { color-scheme: dark; --bg: #0b0f14; --border: #1f2933; --text: #e6edf3; --accent: #22d3ee; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  .bar {
    box-sizing: border-box;
    height: 44px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  .bar a { color: var(--text); text-decoration: none; }
  .bar a:hover { color: var(--accent); }
  .bar .sep { color: var(--border); }
  iframe {
    display: block;
    width: 100%;
    height: calc(100vh - 44px);
    height: calc(100dvh - 44px);
    border: 0;
  }
</style>
</head>
<body>
  <div class="bar">
    <a href="../../index.html">&larr; Back to gallery</a>
    <span class="sep">/</span>
    <a href="../meet-my-agent-crew/">Meet My Agent Crew</a>
  </div>
  <iframe src="../inside-the-agent-crew.html" title="Inside the Agent Crew"></iframe>
</body>
</html>
